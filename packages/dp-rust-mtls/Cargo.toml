[package]
name = "dp-rust-mtls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mTLS client materialization for Delegate Permissions (Rust)"
repository.workspace = true

[features]
default = []
# Requires a C toolchain (clang/MSVC) for the `ring` crypto provider on some hosts.
rustls-config = ["dep:rustls"]

[dependencies]
dp-rust = { path = "../dp-rust" }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rcgen = { version = "0.13", default-features = false, features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = "2"
rustls-pki-types = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
