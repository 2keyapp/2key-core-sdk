[package]
name = "dp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Delegate Permissions machine certificate lifecycle"
repository.workspace = true

[[bin]]
name = "dp-cli"
path = "src/main.rs"

[[bin]]
name = "idr"
path = "src/main.rs"

[[bin]]
name = "dp-agent"
path = "src/bin_agent.rs"

[[bin]]
name = "idr-agent"
path = "src/bin_agent.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
console = "0.15"
dialoguer = "0.11"
dp-rust-sdk = { path = "../dp-rust-sdk" }
dp-rust-mtls = { path = "../dp-rust-mtls" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
