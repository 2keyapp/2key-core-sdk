name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust-billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test two-key-core
        run: cargo test -p two-key-core
      - name: Build CLI
        run: cargo build -p two-key-cli --release
      - name: CLI smoke
        run: ./target/release/two-key version

  rust-dp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test dp-rust workspace crates
        run: cargo test -p dp-rust -p dp-rust-mtls
